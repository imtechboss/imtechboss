<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="tbGradient" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="accentGlow" x1="0" y1="0" x2="64" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#1e3a8a" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- Rounded Base Badge -->
  <rect width="64" height="64" rx="16" fill="url(#tbGradient)" filter="url(#shadow)" />
  
  <!-- Subtle Inner Border -->
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="white" stroke-opacity="0.2" stroke-width="1.5" />
  
  <!-- Tech Boss Modern Monogram 'TB' -->
  <g fill="white" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="900">
    <text x="32" y="44" font-size="30" text-anchor="middle" letter-spacing="-1.5">TB</text>
  </g>

  <!-- Electric Cyan Dot / Tech Indicator -->
  <circle cx="49" cy="18" r="3.5" fill="#38bdf8" />
</svg>
